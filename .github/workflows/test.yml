name: test

# PRs retain type checking and standalone frontend validation. The complete
# contributor and release suites remain available through the local npm scripts;
# release-sign still validates release records before pushing them to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The adapter seam (and only it) is kept under strict TypeScript checking. This
  # job installs development dependencies without running lifecycle scripts.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck

  standalone-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --prefix packages/standalone --ignore-scripts
      - run: npm run typecheck:standalone
      - run: node scripts/build-standalone-ui.mjs --check
      - run: node scripts/build-legacy-payload.mjs --check
